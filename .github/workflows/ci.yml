name: CI

on:
  push:
    branches: [main, development, develop]
  pull_request:
    branches: [main, development, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
      VITE_APP_NAME: Project & Task Management
      VITE_ENABLE_DEVTOOLS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Same Node as local development (.nvmrc). Node 20 is end-of-life, and under Node 20/22
          # jsdom file uploads never reach the test API mock, failing the attachment tests.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist
          retention-days: 7
